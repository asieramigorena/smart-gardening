apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: smart-gardening-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana
    isDefault: true
    editable: false
    secureJsonData:
      password: ${DB_GRAFANA_PASSWORD}
    jsonData:
      database: smart_gardening
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false