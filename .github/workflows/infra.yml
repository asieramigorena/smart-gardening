name: Infra

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      # No backend: CI never connects to AWS or reads remote state.
      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids API rate limits when downloading plugins

      - name: TFLint
        run: tflint --recursive
