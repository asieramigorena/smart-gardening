name: Infra

# No `paths` filter on the triggers (see python.yml): the `changes` job decides instead.
# CI only checks the code: no backend, no AWS credentials, no plan/apply.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the files changed in the PR
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # On push, compare with the previous commit of the same branch (default would be main).
          # Ignored on pull_request, which uses the PR's changed files.
          base: ${{ github.ref }}
          filters: |
            infra:
              - "infra/**"
              - ".github/workflows/infra.yml"

  terraform:
    name: terraform
    needs: changes
    # Skip only when the filter positively says nothing changed. If `changes` fails, run anyway:
    # a skipped job counts as passed for a required check, so failing open would let PRs merge unchecked.
    if: ${{ !cancelled() && needs.changes.outputs.infra != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    env:
      # Root modules, each checked on its own. Add new ones here.
      MODULES: bootstrap main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Terraform and TFLint versions pinned in infra/mise.toml (single source
      # of truth, shared with local development).
      - name: Set up tools (mise)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: "2026.11.0"
          working_directory: infra
          # Do not export [env] (AWS_PROFILE) to later steps: CI has no AWS access.
          env: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend) and validate
        run: |
          for module in $MODULES; do
            echo "::group::$module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            echo "::endgroup::"
          done

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids API rate limits when downloading plugins

      - name: TFLint
        run: |
          for module in $MODULES; do
            echo "::group::$module"
            tflint --chdir="$module" --config="$PWD/.tflint.hcl"
            echo "::endgroup::"
          done
