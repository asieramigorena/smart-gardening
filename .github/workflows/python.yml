name: Python

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "node/**"
      - "ML/**"
      - ".github/workflows/python.yml"
  push:
    branches: [dev, main]
    paths:
      - "node/**"
      - "ML/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Raspberry Pi OS Bookworm

      - name: Install ruff
        run: pip install ruff

      # Real errors only (syntax, undefined names, unused imports...), no style rules.
      - name: Lint
        run: ruff check node ML --select E4,E7,E9,F
