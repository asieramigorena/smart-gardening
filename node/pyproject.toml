# Only to install gardening_node from src/; dependencies are in requirements.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gardening-node"
version = "0.1.0"
description = "Smart gardening sensor node (Raspberry Pi 5 + Grove Base Hat)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
